name: Validate catalog tooling

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --python 3.13
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - run: uv run --python 3.13 python -m unittest discover -s tests -v
      - name: Validate checked-in legacy catalog while migration remains in progress
        run: |
          if [ -f catalog.json ]; then
            uv run --python 3.13 python tools/validate.py
          fi
