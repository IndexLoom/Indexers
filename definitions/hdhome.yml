      default: desc
      options:
        desc: desc
        asc: asc
    authentication:
      method: cookie
      inputs:
        cookie: '{{ .Config.cookie }}'
      test:
        path: index.php
        selector: a[href="logout.php"]
    search:
      paths:
      - path: torrents.php
      inputs:
        $raw: '{{ range .Categories }}cat{{.}}=1&{{end}}'
        search: '{{ if .Query.IMDBID }}{{ .Query.IMDBID }}{{ else }}{{ .Keywords }}{{ end }}'
        incldead: 0
        spstate: '{{ if .Config.freeleech }}2{{ else }}0{{ end }}'
        search_area: '{{ if .Query.IMDBID }}4{{ else }}0{{ end }}'
        search_mode: 0
        sort: '{{ .Config.sort }}'
        type: '{{ .Config.type }}'
        notnewword: 1
      rows:
        selector: table.torrents > tbody > tr:has(table.torrentname)
      fields:
        category:
          selector: a[href*="?cat="]
          attribute: href
          filters:
          - name: querystring
            args: cat
        title_default:
          selector: table.torrentname td a[href*="details.php?id="]
        title:
          selector: a[title][href*="details.php?id="]
          attribute: title
          optional: true
          default: '{{ .Result.title_default }}'
        details:
          selector: a[title][href*="details.php?id="]
          attribute: href
        download:
          selector: a[href*="download.php?id="]
          attribute: href
        imdbid:
          selector: a[href*="imdb.com/title/tt"]
          attribute: href
        doubanid:
          selector: a[href*="movie.douban.com/subject/"]
          attribute: href
        size:
          selector: td.rowfollow:nth-child(5)
          optional: true
          default: 512MB
        seeders:
          selector: td.rowfollow:nth-child(6)
          optional: true
          default: 0
        leechers:
          selector: td.rowfollow:nth-child(7)
          optional: true
          default: 0
        grabs:
          selector: td.rowfollow:nth-child(8)
          optional: true
          default: 0
        date_elapsed:
          selector: td.rowfollow:nth-child(4) > span[title]
          attribute: title
          optional: true
          filters:
          - name: append
            args: ' +08:00'
          - name: dateparse
            args: yyyy-MM-dd HH:mm:ss zzz
        date_added:
          selector: td.rowfollow:nth-child(4):not(:has(span))
          optional: true
          filters:
          - name: append
            args: ' +08:00'
          - name: dateparse
            args: yyyy-MM-ddHH:mm:ss zzz
        date:
          text: '{{ if or .Result.date_elapsed .Result.date_added }}{{ or .Result.date_elapsed .Result.date_added }}{{ else
            }}now{{ end }}'
        downloadvolumefactor:
          case:
            img.pro_free: 0
            img.pro_free2up: 0
            img.pro_50pctdown: 0.5
            img.pro_50pctdown2up: 0.5
            img.pro_30pctdown: 0.3
            '*': 1
        uploadvolumefactor:
          case:
            img.pro_50pctdown2up: 2
            img.pro_free2up: 2
            img.pro_2up: 2
            '*': 1
        description:
          selector: table.torrentname td.embedded:first-child > span:last-child
