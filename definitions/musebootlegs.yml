        seeders: seeders
        size: size
    - name: type
      type: select
      label: Order requested from site
      default: desc
      options:
        desc: desc
        asc: asc
    - name: info_results
      type: info
      label: Search results
      default: If you are getting the error <b>Found no results while trying to browse this tracker</b> then first access
