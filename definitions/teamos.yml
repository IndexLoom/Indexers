    settings:
    - name: info_novpn
      type: info
      label: VPN Not Allowed
      default: You may be banned if you use a VPN, proxy, TOR or data center to access the TeamOS web site. This mean all
        brands of VPNS, no exceptions!!
    - name: cookie
      type: text
      label: Cookie
    - name: info_cookie
      type: info_cookie
    - name: useragent
      type: text
      label: User-Agent
    - name: info_useragent
      type: info_useragent
    - name: freeleech
      type: checkbox
      label: Search freeleech only
      default: false
    - name: info_results
      type: info
      label: Search results
      default: If you are getting the error <b>Found no results while trying to browse this tracker</b> then first access
        the site with your browser and read any mandatory notices that the site presents. You cannot browse torrents with
        unread notices outstanding.
    authentication:
      method: cookie
      inputs:
        cookie: '{{ .Config.cookie }}'
      test:
        path: /
        selector: a[href="/account/"]
    search:
      headers:
        User-Agent:
        - '{{ .Config.useragent }}'
      paths:
      - path: torrents/?filename={{ .Keywords }}&freeleech={{ if .Config.freeleech }}1{{ else }}{{ end }}
        followredirect: true
      - path: torrents/?filename={{ .Keywords }}&page=2&freeleech={{ if .Config.freeleech }}1{{ else }}{{ end }}
        followredirect: true
      - path: torrents/?filename={{ .Keywords }}&page=3&freeleech={{ if .Config.freeleech }}1{{ else }}{{ end }}
        followredirect: true
      - path: torrents/?filename={{ .Keywords }}&page=4&freeleech={{ if .Config.freeleech }}1{{ else }}{{ end }}
        followredirect: true
      rows:
        selector: tr.dataList-row:has(td.download)
      fields:
        category:
          selector: a[href^="/forums/"]
          attribute: href
          filters:
          - name: regexp
            args: \.(\d+)\/$
        title:
          selector: a[href^="/threads/"]
        details:
          selector: a[href^="/threads/"]
          attribute: href
        download:
          selector: td.download a
          attribute: href
        date:
          selector: li.structItem-startDate a time
          attribute: datetime
        size:
          selector: td:nth-last-child(4)
        grabs:
          selector: td:nth-last-child(3)
        seeders:
          selector: td:nth-last-child(2)
        leechers:
          selector: td:nth-last-child(1)
        downloadvolumefactor:
          case:
            span.label:contains("Freeleech"): 0
            '*': 1
        uploadvolumefactor:
          text: 1
        minimumseedtime:
          text: 259200
