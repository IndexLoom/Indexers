kind: Indexer
metadata:
  id: dreadvault-api
  name: DreadVault (API)
  description: DreadVault is a Private Torrent Tracker for HORROR MOVIES / TV
  language: en-US
provenance:
  generatedBy: indexloom-importer/v1
  source:
    project: jackett
    repository: https://github.com/Jackett/Jackett
