            args:
            - (?i)\bTemporada (\d+)\b
            - S$1
          - name: re_replace
            args:
            - (?i)\bEpisodio (\d+)\b
            - E$1
          - name: re_replace
            args:
            - (?i)(\d+)x(\d+)
            - S$1E$2
        details:
