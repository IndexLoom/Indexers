      - id: 8
        cat: TV
        desc: Series Pack
      - id: 9
        cat: TV
        desc: Series Pack VOSTFR
      - id: 4
        cat: Console
        desc: Jeux
      - id: 3
        cat: Books
        desc: Ebooks
      - id: 5
        cat: PC
        desc: Logiciel
      - id: 10
        cat: TV/Sport
        desc: Sports
      modes:
        search:
        - q
        tv-search:
        - q
        - season
        - ep
        - imdbid
        - tvdbid
        - tmdbid
        movie-search:
        - q
        - imdbid
        - tmdbid
        music-search:
        - q
        book-search:
        - q
    settings:
    - name: apikey
      type: text
      label: APIKey
    - name: info_key
      type: info
      label: About your API key
      default: Find or Generate a new API Token by accessing your <a href="https://theoldschool.cc/" target="_blank">The Old
        School</a> account <i>My Settings</i> page and clicking on the <b>API Key</b> tab.
    - name: freeleech
      type: checkbox
      label: Search freeleech only
      default: false
    - name: single_file_release_use_filename
      type: checkbox
      label: Use filename as title for single file releases
      default: true
    - name: tmdbidonly
      type: checkbox
      label: Disable IMDB and TVDB ID search (only support TMDB ID) to potentially improve Sonarr and Radarr results
      default: false
    - name: multilang
      type: checkbox
      label: Replace MULTi by another language in release name
      default: false
    - name: multilanguage
      type: select
      label: Replace MULTi by this language
      default: FRENCH
      options:
        FRENCH: FRENCH
        MULTi FRENCH: MULTi FRENCH
        ENGLISH: ENGLISH
        MULTi ENGLISH: MULTi ENGLISH
        VOSTFR: VOSTFR
        MULTi VOSTFR: MULTi VOSTFR
    - name: vostfr
      type: checkbox
      label: Replace VOSTFR and SUBFRENCH with ENGLISH
      default: false
    - name: vfq
      type: checkbox
      label: Replace VFQ with FRENCH
      default: false
    - name: sort
      type: select
      label: Sort requested from site
      default: created_at
      options:
        created_at: created
        seeders: seeders
        size: size
        name: title
    - name: type
      type: select
      label: Order requested from site
      default: desc
      options:
        desc: desc
        asc: asc
    - name: info_activity
      type: info
      label: Account Inactivity
      default: '''Pruning'' account<ul><li>Your membership requires that you remain active at TOS.</li><li>To not be disabled,
        you must log in to the tracker at least once every 90 days or continuously see at least 1 torrent. If you haven''t
        logged in for more than 90 days and you don''t have any seed torrents as of midnight UTC, your account will be deactivated.</li><li>To
        be reactivated, you also have 30 days to log in and show that your account is back to normal.</li><li>Disabled account:
        90 days of inactivity and no seed torrent.</li><li>''Pruned'' account: Has been deactivated for 30 days , and 90 days
        of inactivity.</li></ul>'
    authentication:
      path: api/torrents
      method: get
      error:
      - selector: a[href*="/login"]
        message:
          text: The API key was not accepted by {{ .Config.sitelink }}.
      - selector: :root:contains("Account is Banned")
    search:
      paths:
      - path: api/torrents/filter
        response:
          type: json
      headers:
        Authorization:
        - Bearer {{ .Config.apikey }}
      inputs:
        $raw: '{{ range .Categories }}&categories[]={{.}}{{end}}'
        name: '{{ .Keywords }}'
        seasonNumber: '{{ .Query.Season }}'
        episodeNumber: '{{ .Query.Ep }}'
        imdbId: '{{ if .Config.tmdbidonly }}{{ else }}{{ .Query.IMDBIDShort }}{{ end }}'
        tmdbId: '{{ .Query.TMDBID }}'
        tvdbId: '{{ if .Config.tmdbidonly }}{{ else }}{{ .Query.TVDBID }}{{ end }}'
        free[]: '{{ if .Config.freeleech }}100{{ else }}{{ end }}'
        sortField: '{{ .Config.sort }}'
        sortDirection: '{{ .Config.type }}'
        perPage: 100
      keywordsfilters:
      - name: re_replace
        args:
        - \.
        - ' '
      rows:
        selector: data
        attribute: attributes
      fields:
        category:
          selector: category_id
        title_optional:
          selector: name
        title_filename:
          selector: files[0].name
          optional: true
        files:
          selector: num_file
        title_phase1:
          text: '{{ if and (.Config.single_file_release_use_filename) (eq .Result.files "1") (.Result.title_filename) }}{{
            .Result.title_filename }}{{ else }}{{ .Result.title_optional }}{{ end }}'
        title_vfq:
          text: '{{ .Result.title_phase1 }}'
          filters:
          - name: re_replace
            args:
            - (?i)\b(VFQ)\b
            - FRENCH
        title_phase2:
          text: '{{ if .Config.vfq }}{{ .Result.title_vfq }}{{ else }}{{ .Result.title_phase1 }}{{ end }}'
        title_vostfr:
          text: '{{ .Result.title_phase2 }}'
          filters:
          - name: re_replace
            args:
            - (?i)\b(vostfr|subfrench)\b
            - ENGLISH
        title_phase3:
          text: '{{ if .Config.vostfr }}{{ .Result.title_vostfr }}{{ else }}{{ .Result.title_phase2 }}{{ end }}'
        title_multilang:
          text: '{{ .Result.title_phase3 }}'
          filters:
          - name: re_replace
            args:
            - (?i)\b(MULTI(?!.*(?:FRENCH|ENGLISH|VOSTFR)))\b
            - '{{ .Config.multilanguage }}'
        title:
          text: '{{ if .Config.multilang }}{{ .Result.title_multilang }}{{ else }}{{ .Result.title_phase3 }}{{ end }}'
        details:
          selector: details_link
        download:
          selector: download_link
        infohash:
          selector: info_hash
        poster:
          selector: meta.poster
          filters:
          - name: replace
            args:
            - https://via.placeholder.com/90x135
            - ''
        imdbid:
          selector: imdb_id
        tmdbid:
          selector: tmdb_id
        tvdbid:
          selector: tvdb_id
        genre:
          selector: meta.genres
          filters:
          - name: re_replace
            args:
            - ' & '
            - _&_
        _internal:
          selector: internal
          case:
            false: '{{ .False }}'
            true: '{{ .True }}'
        description:
          text: '{{ if .Result._internal }}Internal{{ else }}{{ end }}{{ if and .Result._internal .Result.genre }} | {{ else
            }}{{ end }}{{ .Result.genre }}'
        seeders:
          selector: seeders
        leechers:
          selector: leechers
        grabs:
          selector: times_completed
        date:
          selector: created_at
          filters:
          - name: append
            args: ' +00:00'
          - name: dateparse
            args: MM/dd/yyyy HH:mm:ss zzz
        size:
          selector: size
        _featured:
          selector: featured
          case:
            false: '{{ .False }}'
            true: '{{ .True }}'
        downloadvolumefactor_freeleech:
          selector: freeleech
          case:
            0%: 1
            25%: 0.75
            50%: 0.5
            75%: 0.25
            100%: 0
            '*': 0
        downloadvolumefactor:
          text: '{{ if .Result._featured }}0{{ else }}{{ .Result.downloadvolumefactor_freeleech }}{{ end }}'
        uploadvolumefactor_double_upload:
          selector: double_upload
          case:
            false: 1
            true: 2
        uploadvolumefactor:
          text: '{{ if .Result._featured }}2{{ else }}{{ .Result.uploadvolumefactor_double_upload }}{{ end }}'
        minimumseedtime:
          text: 172800
