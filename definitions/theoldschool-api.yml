spec:
  protocol: torrent
  privacy: private
  baseUrls:
  - https://theoldschool.cc/
  implementation:
    engine: cardigann
    encoding: UTF-8
    capabilities:
      categorymappings:
      - id: 1
        cat: Movies
        desc: Films
      - id: 6
        cat: Movies
        desc: Films VOSTFR
      - id: 2
        cat: TV
        desc: Series
      - id: 7
        cat: TV
