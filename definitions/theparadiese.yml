        grabs:
          selector: div.selection_unter_ae
        date_day:
          selector: div.selection_unter_ab:not(:contains("."))
          optional: true
          filters:
          - name: replace
            args:
            - Heute
            - Today
          - name: replace
            args:
            - Gestern
            - Yesterday
          - name: append
            args: ' +01:00'
        date_year:
          selector: div.selection_unter_ab:contains(".")
          optional: true
          filters:
          - name: replace
            args:
            - ' um'
            - ''
          - name: append
            args: ' +01:00'
          - name: dateparse
            args: dd.MM.yyyy HH:mm:ss zzz
        date:
          text: '{{ if or .Result.date_year .Result.date_day }}{{ or .Result.date_year .Result.date_day }}{{ else }}now{{
            end }}'
        seeders:
