    authentication:
      path: signin.php
      method: post
      inputs:
        user: '{{ .Config.user }}'
        pass: '{{ .Config.pass }}'
        returnto: '%2Fbrowse.php'
      error:
      - selector: .error
      test:
        path: index.php
        selector: a[href^="/logout.php?c="]
    search:
      path: browse.php
      inputs:
        $raw: '{{ range .Categories }}c{{.}}=1&{{end}}'
        search: '{{ if .Query.IMDBID }}{{ .Query.IMDBID }}{{ else }}{{ .Keywords }}{{ end }}'
        search_where: '{{ if .Query.IMDBID }}3{{ else }}0{{ end }}'
        status: '{{ if .Config.freeleech }}4{{ else }}1{{ end }}'
        orderby: '{{ .Config.sort }}'
        sort: '{{ .Config.type }}'
      rows:
        selector: table.tableinborder > tbody > tr:has(a[href^="/download.php"])
      fields:
        category:
          selector: a[href^="/browse.php?cat="]
          attribute: href
          filters:
          - name: querystring
            args: cat
        title:
          selector: a[href^="details.php"]
          attribute: title
        details:
          selector: a[href^="details.php"]
          attribute: href
        download:
          selector: a[href^="/download.php"]
          attribute: href
        grabs:
          selector: a[title="Snatcher"]
          optional: true
          default: 0
        files:
          selector: a[title="Files"]
          optional: true
          default: 0
        size:
          selector: td:nth-child(6)
        seeders:
          selector: a[title="Seeder"]
          optional: true
          default: 0
        leechers:
          selector: a[title="Leecher"]
          optional: true
          default: 0
        date_day:
          selector: td:nth-child(10):contains("Heute"), td:nth-child(10):contains("Gestern")
          optional: true
          filters:
          - name: split
            args:
            - b
            - 0
          - name: replace
            args:
            - Heute
            - Today
          - name: replace
            args:
            - Gestern
            - Yesterday
          - name: append
            args: +01:00
        date_year:
          selector: td:nth-child(10):contains("."):contains(":")
          optional: true
          filters:
          - name: split
            args:
            - b
            - 0
          - name: append
            args: +01:00
          - name: dateparse
            args: dd.MM.yyyy HH:mm:ss zzz
        date:
          text: '{{ if or .Result.date_year .Result.date_day }}{{ or .Result.date_year .Result.date_day }}{{ else }}now{{
            end }}'
        downloadvolumefactor:
          case:
            img[alt="OU"]: 0
            img[alt="D/2"]: 0.5
            img[alt="D / 2"]: 0.5
            '*': 1
        uploadvolumefactor:
          case:
            img[alt="2xU"]: 2
            '*': 1
        minimumratio:
          text: 0.8
        minimumseedtime:
          text: 216000
