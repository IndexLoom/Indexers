kind: Indexer
metadata:
  id: jptv4us-api
  name: JPTV4us (API)
  description: JPTV4us is a JAPANESE Private Torrent Tracker for MOVIES / TV / MUSIC / GENERAL
  language: en-US
provenance:
  generatedBy: indexloom-importer/v1
  source:
    project: jackett
    repository: https://github.com/Jackett/Jackett
    revision: 79af48a825cfd3a395acc5726b24f6483e83cb52
