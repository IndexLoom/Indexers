spec:
  protocol: torrent
  privacy: private
  baseUrls:
  - https://portugas.org/
  implementation:
    engine: cardigann
    encoding: UTF-8
    capabilities:
      categorymappings:
      - id: 1
        cat: Movies
        desc: Filmes
      - id: 2
        cat: TV
