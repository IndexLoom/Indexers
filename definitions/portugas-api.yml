      - id: 5
        cat: PC/0day
        desc: Appz
      - id: 7
        cat: XXX
        desc: XXX
      - id: 9
        cat: Books
        desc: E-Books
      - id: 10
        cat: Movies
        desc: Animação Filmes
      - id: 11
        cat: TV/Anime
        desc: Animação TV
      modes:
        search:
        - q
        tv-search:
        - q
        - season
        - ep
        - imdbid
        - tvdbid
        - tmdbid
        movie-search:
        - q
        - imdbid
        - tmdbid
        music-search:
        - q
        book-search:
        - q
    settings:
    - name: apikey
