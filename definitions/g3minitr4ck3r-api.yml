spec:
  protocol: torrent
  privacy: private
  baseUrls:
  - https://gemini-tracker.org/
  implementation:
    engine: cardigann
    encoding: UTF-8
    capabilities:
      categorymappings:
      - id: 1
        cat: Movies
        desc: Films
      - id: 2
        cat: TV
        desc: Séries
      - id: 10
        cat: TV/Sport
        desc: Sports
      - id: 13
        cat: Movies/Other
        desc: Documentaires - Film
      - id: 14
        cat: TV/Documentary
        desc: Documentaires - Series
      - id: 15
        cat: TV
