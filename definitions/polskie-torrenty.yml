    settings:
    - name: cookie
      type: text
      label: Cookie
    - name: info_cookie
      type: info_cookie
    - name: multilang
      type: checkbox
      label: Replace MULTi by another language in release name
      default: false
    - name: multilanguage
      type: select
      label: Replace MULTi by this language
      default: POLISH
      options:
        POLISH: POLISH
        MULTi POLISH: MULTi POLISH
    - name: sort
      type: select
      label: Sort requested from site
      default: date
      options:
        date: created
        seed: seeders
        size: size
        name: title
    - name: type
      type: select
      label: Order requested from site
      default: desc
      options:
        desc: desc
        asc: asc
    - name: info_limit
      type: info
      label: Download Daily Limit
      default: Polskie-Torrenty has a daily limit on downloads. If downloads <b>fail</b> then you have exceeded your daily
        limit. Try again tomorrow.
    authentication:
      method: cookie
      inputs:
        cookie: '{{ .Config.cookie }}'
      test:
        path: index.php
        selector: a[href="logout.php"]
    search:
      paths:
      - path: wyszukaj.php
      inputs:
        $raw: '{{ range .Categories }}c{{.}}=1&{{end}}'
        q: '{{ if .Keywords }}{{ .Keywords }}{{ else }}{{ .Today.Year }}{{ end }}'
        sort: '{{ .Config.sort }}_{{ .Config.type }}'
      rows:
        selector: table.results-table tbody tr
      fields:
        category:
          selector: td:nth-child(1) a
          attribute: href
          filters:
          - name: querystring
            args: sub_category
        title_phase1:
          selector: td:nth-child(2) a
        title_multilang:
          text: '{{ .Result.title_phase1 }}'
          filters:
          - name: re_replace
            args:
            - (?i)\b(MULTI(?!.*(?:POLISH|ENGLISH|\bPL\b)))\b
            - '{{ .Config.multilanguage }}'
          - name: re_replace
            args:
            - (?i)\b(pl)\b
            - POLISH
        title:
          text: '{{ if .Config.multilang }}{{ .Result.title_multilang }}{{ else }}{{ .Result.title_phase1 }}{{ end }}'
        details:
          selector: td:nth-child(2) a
          attribute: href
        download:
          selector: td:nth-child(2) a
          attribute: href
          filters:
          - name: replace
            args:
            - details.php?id=
            - download.php?id=
        date:
          text: now
        size:
          selector: td:nth-child(3)
        seeders:
          selector: td:nth-child(4)
        leechers:
          selector: td:nth-child(5)
        downloadvolumefactor:
          text: 0
        uploadvolumefactor:
          text: 1
