    settings:
    - name: username
      type: text
      label: Username
    - name: password
      type: password
      label: Password
    - name: freeleech
      type: checkbox
      label: Filter freeleech only
      default: false
    - name: sort
      type: select
      label: Sort requested from site
      default: added
      options:
        added: created
        seeders: seeders
        size: size
        name: title
    - name: type
      type: select
      label: Order requested from site
      default: desc
      options:
        desc: desc
        asc: asc
    - name: info_tpp
      type: info
      label: Results Per Page
      default: For best results, change the <b>Torrents per page:</b> setting to <b>100</b> on your account profile. The Default
        is <i>15</i>.
    - name: info_activity
      type: info
      label: Account Inactivity
      default: To keep records updated regularly, all inactive accounts will be deleted after 60 days of inactivity.
    authentication:
      path: index.php?page=login
      method: post
      inputs:
        uid: '{{ .Config.username }}'
        pwd: '{{ .Config.password }}'
      error:
      - selector: tr td span[style="color:#FF0000;"]
      test:
        path: index.php
        selector: a[href="logout.php"]
    search:
      paths:
      - path: index.php
      inputs:
        page: torrents
        search: '{{ .Keywords }}'
        category: '{{ range .Categories }}{{.}};{{end}}'
        options: '{{ if .Config.freeleech }}5{{ else }}0{{ end }}'
        active: 0
        order: '{{ .Config.sort }}'
        by: '{{ .Config.type }}'
      keywordsfilters:
      - name: re_replace
        args:
        - \.
        - ' '
      rows:
        selector: table.lista[width="100%"] > tbody > tr:has(a[href*="download.php?id="]):has(img[title="Locked"])
      fields:
        category:
          selector: a[href^="index.php?page=torrents&category="]
          attribute: href
          filters:
          - name: querystring
            args: category
        title:
          selector: a[href^="index.php?page=torrent-details&id="]
        details:
          selector: a[href^="index.php?page=torrent-details&id="]
          attribute: href
        download:
          selector: a[href^="download.php?id="]
          attribute: href
        poster:
          selector: a[href^="index.php?page=torrent-details&id="]
          attribute: onmouseover
          filters:
          - name: regexp
            args: src=(.+?) width
          - name: replace
            args:
            - torrentimg/nocover.jpg
            - ''
        size:
          selector: td:nth-child(12)
        date:
          selector: td:nth-child(7)
          filters:
          - name: dateparse
            args: dd/MM/yyyy
        seeders:
          selector: td:nth-child(8)
          optional: true
          default: 0
        leechers:
          optional: true
          selector: td:nth-child(9)
          default: 0
        grabs:
          optional: true
          selector: td:nth-child(10)
          default: 0
        downloadvolumefactor:
          case:
            img[src="images/freeleech.gif"]: 0
            img[src="images/gold.gif"]: 0
            img[src="images/silver.gif"]: 0.5
            img[src="images/bronze.gif"]: 0.75
            '*': 1
        uploadvolumefactor:
          text: 1
        minimumratio:
          text: 1.0
        minimumseedtime:
          text: 259200
